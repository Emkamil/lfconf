[workspace]
resolver = "2"
members = [
    "lfconf",
    "lfconfd",
    "lfconf-query",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Emkamil/lfconf-project"
authors = ["Kamil Machowski"]

[workspace.dependencies]
tokio = { version = "1", default-features = false }
zbus = { version = "4", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
parking_lot = "0.12"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }